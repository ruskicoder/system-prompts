# Canary probe markers. Each marker is a visible line "> canary marker N: S" in its file, placed just
# before the heading named by `before` ("END" means the last line of the file). S is one bracket
# shape. The probe asks for marker N; the reply's bracket must match S. The rules never list the
# shapes, so a reply can only match when that part of the rules is still in context.
#
# `harnessctl.py canary rotate` re-draws the shapes and rewrites this file and the marker lines in
# the source files. Run `python3 tools/generate_integrations.py` and reinstall afterwards.
# Paths are relative to the prompt-orchestrator folder.

[markers.1]
file = "AGENT.md"
before = "## A. Identity & Operating Principles"
shape = "["

[markers.2]
file = "AGENT.md"
before = "### Stage 1: Thinking Stage (Research Before Act)"
shape = "("

[markers.3]
file = "AGENT.md"
before = "## F. Token Budget & Resource Manager"
shape = "<"

[markers.4]
file = "AGENT.md"
before = "## K. Workflow Router"
shape = "{"

[markers.5]
file = "AGENT.md"
before = "END"
shape = "("

[markers.6]
file = "skills/communication-tone.md"
before = "## 2. Two Phases: Settle Scope, Then Execute"
shape = "["

[markers.7]
file = "skills/prose-and-wording.md"
before = "## Structure"
shape = "{"

[markers.8]
file = "harness/HARNESS.md"
before = "## 5. Verification"
shape = "<"
